name: Ping Minecraft Servers

on:
  schedule:
    # هر ۶ ساعت (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'server.txt'
      - 'ping.py'
      - '.github/workflows/ping-servers.yml'

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mcstatus

      - name: Run ping script
        run: python ping.py

      - name: Show ping.txt
        run: cat ping.txt

      - name: Commit and push ping.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ping.txt
          git diff --cached --quiet && echo "No changes" || git commit -m "🤖 Update ping.txt [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
